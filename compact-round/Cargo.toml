[package]
name = "compact-lora-round"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ark-bn254 = "=0.5.0"
ark-crypto-primitives = { version = "=0.5.0", features = ["sponge", "r1cs"] }
ark-ff = "=0.5.0"
ark-groth16 = { version = "=0.5.0", features = ["print-trace"] }
ark-poly = "=0.5.0"
ark-r1cs-std = "=0.5.0"
ark-relations = "=0.5.1"
ark-serialize = "=0.5.0"
rand = "=0.8.5"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
